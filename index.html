<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misk Esencia | Under Construction</title>
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            width: 90%;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo Styling */
        .logo {
            max-width: 100%;
            height: auto;
            margin-bottom: 2rem;
        }

        /* Under Construction Text */
        .status-badge {
            display: inline-block;
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            padding: 10px 20px;
            border: 1px solid #ffffff;
            margin-bottom: 3.5rem;
            color: #f0f0f0;
        }

        /* Social Links List */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 2.5rem;
        }

        .social-links a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .social-links a:hover {
            color: #cccccc;
            transform: scale(1.02);
        }

        /* Phone Number */
        .phone-number {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .phone-number a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .phone-number a:hover {
            color: #cccccc;
        }

        /* Responsive adjustments for mobile */
        @media (max-width: 480px) {
            body {
                margin-top: -10vh;
                overflow: hidden;
            }
            .social-links {
                font-size: 1.2rem;
            }
            .phone-number {
                font-size: 1.4rem;
            }
            .status-badge {
                font-size: 0.8rem;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <img src="https://cdn.cmsfly.com/6a73053ae030e7001112465d/images/image_8fd1d8-LqAgI.png" alt="Misk Esencia - perfume oils from Mahir" class="logo">

        <!-- Construction Status -->
        <div class="status-badge">
            Website Under Construction
        </div>

        <!-- Links from Reference Image -->
        <div class="social-links">
            <a href="https://fb.me/miskesencia" target="_blank" rel="noopener noreferrer">fb.me/miskesencia</a>
            <a href="https://m.me/miskesencia" target="_blank" rel="noopener noreferrer">m.me/miskesencia</a>
            <a href="https://ig.me/miskesencia" target="_blank" rel="noopener noreferrer">ig.me/miskesencia</a>
            <a href="https://wa.me/8801777222842" target="_blank" rel="noopener noreferrer">wa.me/miskesencia</a>
        </div>

        <!-- Phone Number -->
        <div class="phone-number">
            <a href="tel:+8801777222842">+8801777222842</a>
        </div>
    </div>

</body>
</html>
